# Local, production-like stack:  docker compose up --build
# Then open http://localhost:8000  (health check: /healthz/)

services:
  db:
    image: postgres:18.1
    restart: unless-stopped
    environment:
      POSTGRES_DB: ems
      POSTGRES_USER: ems
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ems}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems -d ems"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in your .env file}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      # Plain http://localhost by default. Set to 1 behind an HTTPS proxy.
      DJANGO_HTTPS: ${DJANGO_HTTPS:-0}
      DJANGO_BEHIND_PROXY: ${DJANGO_BEHIND_PROXY:-0}
      DATABASE_URL: postgres://ems:${POSTGRES_PASSWORD:-ems}@db:5432/ems
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
    ports:
      - "8000:8000"

volumes:
  pgdata:
