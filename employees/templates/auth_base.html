<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMS System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 h-screen flex">
    <!-- Left Side: Branding -->
    <div class="hidden lg:flex w-1/2 bg-indigo-600 text-white flex-col justify-center items-center p-12">
        <h1 class="text-5xl font-bold mb-4">EMS System</h1>
        <p class="text-indigo-200 text-lg max-w-md text-center">Manage your employees, departments, and payroll with ease.</p>
    </div>

    <!-- Right Side: Content Block -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-8 bg-white overflow-y-auto">
        <div class="w-full max-w-md py-8">
            {% block auth_content %}{% endblock %}
        </div>
    </div>
</body>
</html>
