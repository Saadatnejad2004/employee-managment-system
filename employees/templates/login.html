{% extends 'auth_base.html' %}

{% block auth_content %}
<div class="mb-10">
    <h2 class="text-3xl font-bold text-gray-900">Welcome Back</h2>
    <p class="text-gray-500 mt-2">Please sign in to your account</p>
</div>

{% if form.errors %}
    <div class="bg-red-50 text-red-600 text-sm p-4 rounded-lg mb-6 border border-red-100 flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        Invalid username or password. Please try again.
    </div>
{% endif %}

<form method="POST" class="space-y-6">
    {% csrf_token %}
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
        <input type="text" name="username" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="Enter your username">
    </div>
    <div>
        <div class="flex justify-between items-center mb-2">
            <label class="block text-sm font-medium text-gray-700">Password</label>
            <a href="{% url 'password_reset' %}" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">Forgot password?</a>
        </div>
        <input type="password" name="password" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="••••••••">
    </div>
    <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition shadow-md">
        Sign In
    </button>
</form>

<p class="mt-8 text-center text-sm text-gray-600">
    Don't have an account? 
    <a href="{% url 'register' %}" class="font-medium text-indigo-600 hover:text-indigo-500">Create one now</a>
</p>
{% endblock %}
