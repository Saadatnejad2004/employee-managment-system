{% extends 'auth_base.html' %}
{% block auth_content %}
<div class="mb-8">
    <h2 class="text-2xl font-bold text-gray-900">Reset Password</h2>
    <p class="text-gray-500 mt-2 text-sm">Enter your email address and we'll send you a link to reset your password.</p>
</div>
<form method="POST" class="space-y-5">
    {% csrf_token %}
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
        <input type="email" name="email" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="name@example.com">
    </div>
    <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition shadow-md">
        Send Reset Link
    </button>
</form>
<div class="mt-6 text-center">
    <a href="{% url 'login' %}" class="text-sm font-medium text-gray-500 hover:text-gray-900">&larr; Back to login</a>
</div>
{% endblock %}
